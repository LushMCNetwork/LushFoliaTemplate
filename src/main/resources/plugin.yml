name: LushFoliaTemplate
version: ${project.version}
main: com.playgamesinteractive.template.TemplatePlugin
api-version: '1.21.11'
depend: [LushMenus]
folia-supported: true
authors: [PlayGamesInteractive]
description: Modern MiniMessage starter for LushMC Folia plugins
website: https://playgamesinteractive.com
commands:
  template:
    description: Opens the starter menu and demonstrates command routing.
    usage: /template [menu|echo <text>|reload]
permissions:
  lushtemplate.use:
    description: Access to the starter menu and echo example.
    default: true
  lushtemplate.admin:
    description: Reload the complete configuration and menu snapshot.
    default: op
