  display_name: " "
  item_flags: []
  enchantment_glint_override: false

corner:
  material: LIGHT_BLUE_STAINED_GLASS_PANE
  display_name: " "
  item_flags: []
  enchantment_glint_override: false

items:
  greeting:
    material: EMERALD
    slot: 11
    display_name: "<bold><#00f396>TRY AN ACTION</bold>"
    lore:
