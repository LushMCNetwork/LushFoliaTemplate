      - "[greet]"
  guide:
    material: BOOK
    slot: 13
    display_name: "<bold><#00a4fe>DEVELOPMENT GUIDE</bold>"
    lore:
      - "<gray>Plugin Development"
      - ""
      - "<#fdf700>Information"
      - "<white>Edit the templates and register"
      - "<white>your own feature handlers."
      - ""
      - "<#ff7200>⚡ <white>Quick Access: <#ff7200>/template echo hello"
  close:
    material: BARRIER
    slot: 15
    display_name: "<bold><#ff1155>CLOSE MENU</bold>"
    lore:
      - "<gray>Menu Navigation"
      - ""
      - "<#fdf700>Information"
      - "<white>Close this menu and return"
      - "<white>to your game."
      - ""
      - "<#fdf700>▶ <underlined><bold>CLICK</bold></underlined> to Close"
    click_commands:
      - "[close]"
